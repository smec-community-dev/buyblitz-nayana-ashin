<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            width: 400px;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .login-title {
            text-align: center;
            margin-bottom: 10px;
        }
        .login-subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .password-input {
            display: flex;
            align-items: center;
        }
        .password-input button {
            margin-left: 8px;
            padding: 8px 12px;
            cursor: pointer;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: #4e6ef2;
            color: #fff;
            border: none;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
        .divider {
            text-align: center;
            margin: 20px 0;
            color: #aaa;
        }
        .social-login button {
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            border: 1px solid #ccc;
            border-radius: 8px;
            cursor: pointer;
            background: #fafafa;
        }
        .error-msg {
            color: red;
            margin-top: 10px;
            text-align: center;
        }
    </style>

</head>
<body>

<div class="login-container">

    <h2 class="login-title">Seller Login</h2>
    <p class="login-subtitle">Access your seller dashboard</p>

    <form id="login-form" method="POST" action="">
        {% csrf_token %}

        <div class="form-group">
            <label for="email">Username / Email</label>
            <input type="text" id="email" name="username" placeholder="Enter username or email" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <div class="password-input">
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
                <button type="button" class="toggle-password">👁️</button>
            </div>
        </div>

        <button type="submit" class="login-btn">Sign In</button>

        {% if error %}
            <p class="error-msg">{{ error }}</p>
        {% endif %}

        <div class="divider">or continue with</div>

        <div class="social-login">
            <button type="button" class="google"><span>G</span> Continue with Google</button>
            <button type="button" class="facebook"><span>f</span> Continue with Facebook</button>
            <button type="button" class="apple"><span>🍎</span> Continue with Apple</button>
        </div>

    </form>
</div>

<script>
    // Password toggle
    document.querySelector(".toggle-password").addEventListener("click", function () {
        const pwd = document.getElementById("password");
        pwd.type = pwd.type === "password" ? "text" : "password";
    });
</script>

</body>
</html>
