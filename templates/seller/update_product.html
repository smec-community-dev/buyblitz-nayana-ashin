<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

<div class="container mx-auto p-6 max-w-3xl">
    <h2 class="text-2xl font-bold mb-6 text-center">Edit Product</h2>

    <form method="POST" enctype="multipart/form-data" class="bg-white p-6 rounded-lg shadow-lg">
        {% csrf_token %}

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">

            <!-- Subcategory -->
            <div>
                <label class="font-medium">Subcategory</label>
                <select name="sub_category" class="mt-2 w-full p-2 border rounded-md">

                    {% for sub in subcategories %}
                        <option value="{{ sub.id }}"
                            {% if product.sub_category and product.sub_category.id == sub.id %}
                                selected
                            {% endif %}>
                            {{ sub.name }}
                        </option>
                    {% endfor %}

                </select>
            </div>

            <!-- Product Name -->
            <div>
                <label class="font-medium">Product Name</label>
                <input type="text" name="product_name" value="{{ product.title }}"
                       class="mt-2 p-2 block w-full border rounded-md" required>
            </div>

            <!-- Price -->
            <div>
                <label class="font-medium">Price</label>
                <input type="number" step="0.01" name="price" value="{{ product.price }}"
                       class="mt-2 p-2 block w-full border rounded-md" required>
            </div>

            <!-- Stock -->
            <div>
                <label class="font-medium">Stock</label>
                <input type="number" name="stock" value="{{ product.stock }}"
                       class="mt-2 p-2 block w-full border rounded-md" required>
            </div>

            <!-- Rating -->
            <div>
                <label class="font-medium">Rating</label>
                <select name="rating" class="mt-2 p-2 block w-full border rounded-md">
                    {% for r in "12345" %}
                        <option value="{{ r }}"
                            {% if product.rating|stringformat:"s" == r %}selected{% endif %}>
                            {{ r }} ★
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Slug -->
            <div>
                <label class="font-medium">Slug</label>
                <input type="text" name="slug" value="{{ product.slug }}"
                       class="mt-2 p-2 block w-full border rounded-md" required>
            </div>

            <!-- Description -->
            <div class="sm:col-span-2">
                <label class="font-medium">Description</label>
                <textarea name="description" rows="4"
                          class="mt-2 p-2 block w-full border rounded-md" required>{{ product.description }}</textarea>
            </div>

            <!-- Current Images -->
            <div class="sm:col-span-2">
                <label class="font-medium">Current Images:</label>
                <div class="flex gap-3 mt-2 flex-wrap">
                    {% for img in product.images.all %}
                        <img src="{{ img.image.url }}" class="h-24 w-24 object-cover rounded-md border">
                    {% empty %}
                        <p class="text-gray-500">No images uploaded</p>
                    {% endfor %}
                </div>
            </div>

            <!-- Upload New Images -->
            <div class="sm:col-span-2 mt-4">
                <label class="font-medium">Upload New Images</label>
                <input type="file" name="images" multiple
                       class="mt-2 p-2 block w-full border rounded-md">
            </div>

        </div>

        <!-- Buttons -->
        <div class="flex justify-between mt-6">
            <a href="{% url 'seller_products' %}"
               class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-md">
                Cancel
            </a>

            <button type="submit"
                    class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-md">
                Update Product
            </button>
        </div>

    </form>
</div>

</body>
</html>
