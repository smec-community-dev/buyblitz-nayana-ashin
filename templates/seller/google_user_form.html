<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete User Registration - ShopHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <style>
        /* Copy all styles from register.html */
        :root {
            --bg-color: #F8FBFF;
            --primary-color: #3B82F6;
            --accent-color: #60A5FA;
            --secondary-color: #2563EB;
            --text-color: #1E3A8A;
            --light-text: #64748B;
            --hover-color: #2563EB;
            --input-bg: #F0F9FF;
            --input-border: #BFDBFE;
            --card-bg: rgba(255, 255, 255, 0.95);
            --shadow-light: 0 8px 30px rgba(59, 130, 246, 0.08);
            --shadow-medium: 0 15px 40px rgba(59, 130, 246, 0.12);
            --font-heading: 'Playfair Display', serif;
            --font-body: 'Open Sans', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background: linear-gradient(135deg, #F8FBFF 0%, #EFF6FF 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: var(--card-bg);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: var(--shadow-medium);
        }

        .form-section {
            padding: 50px 45px;
        }

        .form-header {
            margin-bottom: 30px;
            text-align: center;
        }

        .logo {
            font-family: var(--font-heading);
            font-size: 2.4rem;
            font-weight: 800;
            margin-bottom: 10px;
            color: var(--primary-color);
        }

        .form-header h1 {
            font-family: var(--font-heading);
            color: var(--primary-color);
            margin-bottom: 12px;
            font-size: 2.2rem;
            font-weight: 700;
        }

        .form-header p {
            color: var(--light-text);
            font-size: 1rem;
        }

        .google-info {
            background: #F0F9FF;
            border-left: 4px solid var(--primary-color);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .google-info p {
            color: var(--text-color);
            font-size: 0.95rem;
            margin-bottom: 5px;
        }

        .google-info strong {
            color: var(--primary-color);
        }

        .input-group {
            margin-bottom: 22px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-color);
            font-size: 0.95rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #94A3B8;
            font-size: 1.1rem;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px 14px 48px;
            border-radius: 10px;
            border: 1.5px solid var(--input-border);
            font-family: var(--font-body);
            font-size: 1rem;
            transition: all 0.3s ease;
            background-color: var(--input-bg);
            color: var(--text-color);
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .input-group input:disabled {
            background-color: #E2E8F0;
            cursor: not-allowed;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.4s ease;
            background: linear-gradient(135deg, var(--accent-color) 0%, var(--primary-color) 100%);
            color: white;
            margin-top: 10px;
            box-shadow: var(--shadow-light);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.25);
        }

        @media (max-width: 550px) {
            .form-section {
                padding: 30px 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-section">
            <div class="form-header">
                <div class="logo">ShopHub</div>
                <h1>Complete Your Profile</h1>
                <p>Just one more step to get started!</p>
            </div>

            <div class="google-info">
                <p><strong>Signing in with Google</strong></p>
                <p>Email: {{ google_email }}</p>
            </div>

            <form method="POST" action="{% url 'finalize_google_user' %}">
                {% csrf_token %}

                <div class="input-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input type="text" id="username" name="username" placeholder="Choose a username" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="phone">Phone Number (Optional)</label>
                    <div class="input-wrapper">
                        <span class="input-icon">📱</span>
                        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">
                    </div>
                </div>

                <button type="submit" class="btn">COMPLETE REGISTRATION</button>
            </form>
        </div>
    </div>
</body>
</html>
