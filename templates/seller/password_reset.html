<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - ShopHub Seller</title>
    <style>
        :root {
            --bg-color: #F8FBFF;
            --primary-color: #3B82F6;
            --accent-color: #60A5FA;
            --text-color: #1E3A8A;
            --light-text: #64748B;
            --input-bg: #F0F9FF;
            --input-border: #BFDBFE;
            --card-bg: rgba(255, 255, 255, 0.95);
            --shadow-medium: 0 15px 40px rgba(59, 130, 246, 0.12);
            --error-color: #EF4444;
            --success-color: #10B981;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            background: linear-gradient(135deg, #F8FBFF 0%, #EFF6FF 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 450px;
            width: 100%;
            background: var(--card-bg);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: var(--shadow-medium);
        }

        .form-section {
            padding: 50px 45px;
        }

        .form-header {
            margin-bottom: 30px;
            text-align: center;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 2.4rem;
            font-weight: 800;
            margin-bottom: 10px;
            color: var(--primary-color);
        }

        .form-header h1 {
            font-family: 'Playfair Display', serif;
            color: var(--primary-color);
            margin-bottom: 12px;
            font-size: 2.2rem;
        }

        .input-group {
            margin-bottom: 22px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 10px;
            border: 1.5px solid var(--input-border);
            font-size: 1rem;
            background-color: var(--input-bg);
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent-color) 0%, var(--primary-color) 100%);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.25);
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .error-msg {
            color: var(--error-color);
            background: #FEF2F2;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid var(--error-color);
        }

        .success-msg {
            color: var(--success-color);
            background: #ECFDF5;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid var(--success-color);
        }

        @media (max-width: 550px) {
            .form-section {
                padding: 30px 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-section">
            <div class="form-header">
                <div class="logo">ShopHub Seller</div>
                <h1>Reset Password</h1>
                <p>Enter your email to receive a reset link</p>
            </div>

            {% if form.errors %}
                <div class="error-msg">
                    Please enter a valid email address.
                </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <div class="input-group">
                    <input type="email" name="email" placeholder="Enter your email address" required>
                </div>

                <button type="submit" class="btn">SEND RESET LINK</button>
            </form>

            <div class="back-link">
                <a href="{% url 'login' %}">← Back to Login</a>
            </div>
        </div>
    </div>
</body>
</html>
