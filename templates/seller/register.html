<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background: #f5f5f5;
        }

        .container {
            background: white;
            max-width: 450px;
            margin: auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border-radius: 6px;
            border: 1px solid #bbb;
        }

        .role-section {
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }

        .role-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: royalblue;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .btn:hover {
            background: #1746a2;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Create Account</h2>

    <form method="POST" action="/seller/register/">
        {% csrf_token %}

        <div class="input-group">
            <label>First Name</label>
            <input type="text" name="first_name" required>
        </div>

        <div class="input-group">
            <label>Last Name</label>
            <input type="text" name="last_name" required>
        </div>

        <div class="input-group">
            <label>Username</label>
            <input type="text" name="username" required>
        </div>

        <div class="input-group">
            <label>Email</label>
            <input type="email" name="email" required>
        </div>

        <div class="input-group">
            <label>Select Role</label>
            <select name="role" id="roleSelect" required>
                <option value="" selected disabled>Select your account type</option>
                <option value="user">User</option>
                <option value="seller">Seller</option>
                <option value="admin">Admin</option>
            </select>
        </div>

        <!-- USER FIELDS -->
        <div id="userFields" class="role-section">
            <div class="input-group">
                <label>Phone Number</label>
                <input type="text" name="phone">
            </div>
        </div>

        <!-- SELLER FIELDS -->
        <div id="sellerFields" class="role-section">
            <div class="input-group">
                <label>Shop Name</label>
                <input type="text" name="shop_name" required>
            </div>

            <div class="input-group">
                <label>Shop Type</label>
                <select name="shop_type" required>
                    <option value="RETAIL">Retail Shop</option>
                    <option value="WHOLESALE">Wholesale</option>
                    <option value="DROPSHIPPING">Dropshipping</option>
                    <option value="MANUFACTURER">Manufacturer</option>
                    <option value="OTHER">Other</option>
                </select>
            </div>

            <div class="input-group">
                <label>Shop Address</label>
                <input type="text" name="shop_address" required>
            </div>

            <div class="input-group">
                <label>GST Number</label>
                <input type="text" name="gst_number" required>
            </div>

            <div class="input-group">
                <label>Bank Account Number</label>
                <input type="text" name="bank_account_number" required>
            </div>
        </div>

        <!-- ADMIN FIELDS (OPTIONAL) -->
        <div id="adminFields" class="role-section">
            <div class="input-group">
                <label>Employee ID</label>
                <input type="text" name="admin_id">
            </div>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" name="password" required>
        </div>

        <button class="btn" type="submit">CREATE ACCOUNT</button>
    </form>
</div>

<script>
    const roleSelect = document.getElementById("roleSelect");
    const userFields = document.getElementById("userFields");
    const sellerFields = document.getElementById("sellerFields");
    const adminFields = document.getElementById("adminFields");

    roleSelect.addEventListener("change", () => {
        userFields.classList.remove("active");
        sellerFields.classList.remove("active");
        adminFields.classList.remove("active");

        if (roleSelect.value === "user") userFields.classList.add("active");
        if (roleSelect.value === "seller") sellerFields.classList.add("active");
        if (roleSelect.value === "admin") adminFields.classList.add("active");
    });
</script>

</body>
</html>
